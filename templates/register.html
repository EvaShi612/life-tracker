{% extends "layout.html" %}

{% block body %}

<h1>Register</h1>

<form method="POST">

    <label>Name</label>
    <input type="text" name="name">

    <br><br>

    <label>Email</label>
    <input type="email" name="email">

    <br><br>

    <label>Password</label>
    <input type="password" name="password">

    <br><br>

    <button type="submit">
        Register
    </button>

</form>

{% endblock %}
