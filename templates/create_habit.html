<!--继承layout.html-->
{%extends "layout.html"%}
{%block body%}
<h1>Create Habit</h1>

<form method="POST">
     <label>Habit Name</label>
    <input type="text" name="habit_name">

    <br><br>

    <label>Details</label>
    <textarea
    name="details"
    rows="4"
    cols="40"
    placeholder="Describe your habit..."
    ></textarea>

    <br><br>

    <button type="submit">Save</button>
</form>

<a href="{{ url_for('dashboard') }}">Back to Dashboard</a>

{% endblock %}
